<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog & Podcast | Women in STEM</title>
<meta name="description" content="Blog posts, podcast episodes, and Women in STEM spotlights from the WIS community.">
<link rel="icon" href="images/logo/classic_logo.jpg" type="image/jpeg">
<link rel="apple-touch-icon" href="images/logo/classic_logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div id="site-header"></div>

<main id="main">
<section class="page-hero">
  <div class="wrap">
    <div class="eyebrow">Content</div>
    <h1>Blog & Podcast</h1>
    <p>Stories, spotlights, career advice, and conversations from the Women in STEM community.</p>
  </div>
</section>

<section>
  <div class="wrap">
    <div class="content-tabs" role="tablist" aria-label="Content types">
      <button class="tab-btn active" type="button" role="tab" aria-selected="true" data-tab="blog">Blog</button>
      <button class="tab-btn" type="button" role="tab" aria-selected="false" data-tab="podcast">Podcast</button>
      <button class="tab-btn" type="button" role="tab" aria-selected="false" data-tab="spotlights">Spotlights</button>
    </div>

    <div data-panel="blog" role="tabpanel" id="blog-panel"></div>
    <div data-panel="podcast" class="hidden" role="tabpanel" id="podcast-panel"></div>
    <div data-panel="spotlights" class="hidden" role="tabpanel" id="spotlights-panel"></div>
  </div>
</section>
</main>

<div id="site-footer"></div>

<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script>
  initLayout("blog");
  document.getElementById("blog-panel").innerHTML = renderBlogPanel();
  document.getElementById("podcast-panel").innerHTML = renderPodcastPanel();
  document.getElementById("spotlights-panel").innerHTML = renderSpotlightPanel();
</script>
</body>
</html>
